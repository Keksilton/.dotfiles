# yaml-language-server: $schema=https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json

upgrade:
  source: cdn
  interval: 168h
  auto: false
  notice: false
blocks:
  - type: prompt
    #newline: true
    alignment: left
    segments:
      - template: <p:decoration>┏[</>{{ if .SSHSession }} {{ end }}
        foreground: 'p:accent'
        type: session
        style: plain
      - template: <p:decoration></>{{ .UserName }}
        foreground: 'p:info'
        type: session
        style: plain
      - template: <p:accent>{{.Icon}}</>
        foreground: 'p:accent'
        type: os
        style: plain
      - template: <p:info>{{ .HostName }}</><p:decoration>]</>
        foreground: 'p:info'
        type: session
        style: plain
      - properties:
          fetch_stash_count: true
          fetch_status: true
          fetch_upstream_icon: true
          branch_icon: " "
        # Icons and layout follow the 1_shell theme: working | staging, then stash count
        template: "<p:decoration>-[</>{{ .UpstreamIcon }}{{ .HEAD }}{{ if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}<#8fbcbb>  {{ .Working.String }}</>{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }}<p:danger>  {{ .Staging.String }}</>{{ end }}{{ if gt .StashCount 0 }}  {{ .StashCount }}{{ end }}<p:decoration>]</>"
        foreground: 'p:accent'
        type: git
        style: plain
      - template: <p:decoration>-[</>{{.Profile}}{{if .Region}}@{{.Region}}{{end}}<p:decoration>]</>
        foreground: 'p:accent'
        type: aws
        style: plain
      - template: '<p:decoration>-[</>{{.Context}}{{if .Namespace}} :: {{.Namespace}}{{end}}<p:decoration>]</>'
        foreground: 'p:accent'
        type: kubectl
        style: plain
      - template: <p:decoration>[</><p:decoration>]</>
        foreground: '#d8dee9'
        type: root
        style: plain
      - template: <p:decoration>[x</>{{ reason .Code }}<p:decoration>]</>
        foreground: '#d8dee9'
        type: status
        style: plain
  - type: prompt
    alignment: left
    segments:
      - properties:
          style: full
        template: <p:decoration>┖[</>{{ .Path }}<p:decoration>]</>
        foreground: '#88c0d0'
        type: path
        style: plain
    newline: true
  - type: prompt
    alignment: left
    segments:
      - template: '  '
        foreground: '#5e81ac'
        type: text
        style: plain
    newline: true
#transient_prompt:
#  foreground: 'p:decoration'
#  background: 'transparent'
#  template: '  '
palette:
  info: "#88c0d0"
  accent: "#b48ead"
  decoration: "#5e81ac"
  danger: "#88c0d0" 
version: 3
final_space: true
