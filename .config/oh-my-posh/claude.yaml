# yaml-language-server: $schema=https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json

# Claude Code status line, rendered by `oh-my-posh claude` (see ~/.claude/settings.json)
blocks:
  - type: prompt
    alignment: left
    segments:
      - template: <p:decoration>[</>{{ .Model.DisplayName }}{{ if and .Effort .Effort.Level }} <p:decoration>·</> {{ .Effort.Level }}{{ end }}{{ if .FastMode }} <p:accent>fast</>{{ end }}<p:decoration>]-[</><p:accent>{{ .TokenGaugeUsed }}</> {{ .TokenUsagePercent }}%<p:decoration>]</>{{ if .FiveHourUsage }}<p:decoration>-[</>5h {{ .FiveHourUsage }}%<p:decoration>]</>{{ end }}
        foreground: 'p:info'
        type: claude
        style: plain
      - properties:
          fetch_stash_count: true
          fetch_status: true
          fetch_upstream_icon: true
          branch_icon: " "
        # Same git format as the shell prompt in config.yaml
        template: "<p:decoration>-[</>{{ .UpstreamIcon }}{{ .HEAD }}{{ if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}<#8fbcbb>  {{ .Working.String }}</>{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }}<p:danger>  {{ .Staging.String }}</>{{ end }}{{ if gt .StashCount 0 }}  {{ .StashCount }}{{ end }}<p:decoration>]</>"
        foreground: 'p:accent'
        type: git
        style: plain
      - properties:
          style: full
        template: <p:decoration>-[</>{{ .Path }}<p:decoration>]</>
        foreground: '#88c0d0'
        type: path
        style: plain
palette:
  info: "#88c0d0"
  accent: "#b48ead"
  decoration: "#5e81ac"
  danger: "#88c0d0"
version: 3
