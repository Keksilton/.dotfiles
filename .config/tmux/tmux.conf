set-option -sa terminal-overrides ",xterm*:Tc"

#set -g mouse on

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set -g mouse on
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'Keksilton/tmux-ayu-theme'
set -g @plugin 'tmux-plugins/tmux-battery'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Install TPM and plugins on first start (TPM isn't tracked in the dotfiles repo).
# With the config at ~/.config/tmux/tmux.conf, TPM uses ~/.config/tmux/plugins/ by itself.
# tmux only reports exit codes, so keep git's output in a log for troubleshooting
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm >~/.config/tmux/tpm-install.log 2>&1 && ~/.config/tmux/plugins/tpm/bin/install_plugins >>~/.config/tmux/tpm-install.log 2>&1'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
